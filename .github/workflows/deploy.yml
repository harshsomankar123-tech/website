name: Build and Deploy Site

on:
  # Test and preview on pull requests
  pull_request:
    types: [opened, synchronize, reopened, closed]

  # Deploy on pushes to main
  push:
    branches:
      - main

  # Deploy when the Gemara spec publishes a release
  # (sent by the spec repo's website-dispatch workflow)
  repository_dispatch:
    types:
      - gemara-release

  # Allow manual runs, optionally against a specific spec ref
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "Gemara spec ref to build against (default: latest release)"
        required: false

# Sets permissions of the GITHUB_TOKEN to minimum required
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve spec ref
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          INPUT_REF: ${{ inputs.spec-ref }}
        run: |
          if [ -n "$DISPATCH_REF" ]; then
            ref="$DISPATCH_REF"
          elif [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
          else
            ref="$(gh api repos/gemaraproj/gemara/releases/latest --jq .tag_name || true)"
            if [ -z "$ref" ]; then
              echo "::warning::Could not resolve latest gemara release; falling back to main"
              ref="main"
            fi
          fi
          echo "Building against gemara spec ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Fetch spec OpenAPI
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.spec.outputs.ref }}
        run: |
          mkdir -p generated
          # Releases publish openapi.yaml as an asset; fall back to
          # generating it from a spec checkout for refs that predate the
          # asset (or when building against a branch like main).
          if [ "$REF" != "main" ] && gh release download "$REF" \
              --repo gemaraproj/gemara \
              --pattern openapi.yaml \
              --output generated/openapi.yaml 2>/dev/null; then
            echo "Downloaded openapi.yaml from release $REF"
          else
            echo "::warning::No openapi.yaml release asset for $REF; generating from a spec checkout"
            git clone --depth 1 --branch "$REF" https://github.com/gemaraproj/gemara .gemara-spec
            (cd .gemara-spec/cmd && go run . cue2openapi \
              --schema .. \
              --output "$GITHUB_WORKSPACE/generated/openapi.yaml")
          fi

      - name: Generate documentation
        run: make gendocs

      - name: Build with Jekyll
        if: github.event_name != 'pull_request'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Build with Jekyll for testing
        if: github.event_name == 'pull_request'
        run: bundle exec jekyll build -d _site

      - name: Test HTML
        run: make test-links

      - name: Upload artifact for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Build with Jekyll for PR preview
        if: github.event_name == 'pull_request'
        run: |
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}" -d _site_preview

      - name: Upload artifact for PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-preview
          path: _site_preview
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  preview:
    name: Deploy PR Preview
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download preview artifact
        if: github.event.action != 'closed'
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: pr-preview
          path: _site

      - name: Ensure preview directory exists for cleanup
        if: github.event.action == 'closed'
        run: mkdir -p _site

      - name: Deploy or cleanup PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false

      - name: Update PR Preview Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const marker = '<!-- gemara-pr-preview-comment -->';
            const isClosed = context.payload.action === 'closed';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${prNumber}/`;

            let body;
            if (isClosed) {
              body = `${marker}\n### 🌐 Gemara Website Staging Preview\n\nThanks @${author} for contributing to the Gemara website!\n\n| Detail | Status |\n| :--- | :--- |\n| **Status** | 🔴 Closed (Preview removed) |\n\n> *The preview environment for PR #${prNumber} has been torn down.*`;
            } else {
              body = `${marker}\n### 🌐 Gemara Website Staging Preview\n\nThanks @${author} for contributing to the Gemara website!\n\nYour deployment link is **[here](${previewUrl})**.\n\n| Detail | Link |\n| :--- | :--- |\n| **Preview Link** | [here](${previewUrl}) |\n| **Commit** | \`${sha}\` |\n| **Status** | 🟢 Active |\n\n> *This preview environment is temporary and automatically updates with every new commit.*`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else if (!isClosed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
